name: ci_314553003

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-314553003-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node.js ${{ matrix.node-version }} | Typecheck + Prettier + Vitest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22',    '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        id: typecheck
        run: npx tsc --noEmit

      - name: Prettier check
        id: prettier
        run: >
          npx prettier --check
          src
          test
          .github
          package.json
          package-lock.json
          tsconfig.json
          vitest.config.ts
          .eslintrc.cjs
          .prettierrc
          docker-compose.yml
          README.md

      - name: Run tests and generate JUnit report
        id: test
        run: |
          mkdir -p test-results
          npx vitest run \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=test-results/vitest-junit-node-${{ matrix.node-version }}.xml

      - name: Publish test results to GitHub Actions
        if: always() && hashFiles('test-results/*.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Vitest Test Report - Node.js ${{ matrix.node-version }}
          path: test-results/*.xml
          reporter: java-junit

      - name: Upload test result artifact
        if: always() && hashFiles('test-results/*.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-report-node-${{ matrix.node-version }}
          path: test-results/*.xml

      - name: Add CI summary
        if: always()
        run: |
          echo "## CI Summary - Node.js ${{ matrix.node-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Purpose | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript typecheck | Check TypeScript type errors | ${{ steps.typecheck.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Prettier check | Check code and config formatting | ${{ steps.prettier.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Vitest unit test | Run Fastify API unit tests | ${{ steps.test.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "JUnit report: \`test-results/vitest-junit-node-${{ matrix.node-version }}.xml\`" >> "$GITHUB_STEP_SUMMARY"
